[project]
name = "srddqn-v3"
version = "0.1.0"
description = ""
authors = [
    {name = "chadwickhugedick",email = "Brandontwd@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "stable-baselines3[extra] (>=2.8.0,<3.0.0)",
    "gymnasium (>=1.3.0,<2.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "numpy (>=2.4.6,<3.0.0)",
    "pyarrow (>=24.0.0,<25.0.0)",
    "fastparquet (>=2026.5.0,<2027.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "ccxt (>=4.5.56,<5.0.0)",
    "wandb (>=0.19.1,<0.20.0)"
]

[tool.poetry.dependencies]
torch = {version = ">=2.5.0,<3.0.0", source = "pytorch"}
torchvision = {version = ">=0.20.0,<1.0.0", source = "pytorch"}
torchaudio = {version = ">=2.5.0,<3.0.0", source = "pytorch"}


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
priority = "explicit"

