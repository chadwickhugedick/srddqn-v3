program: training/sweep_dqn.py
method: bayes
metric:
  name: sharpe_ratio
  goal: maximize
command:
  - poetry
  - run
  - python
  - ${program}
  - ${args}
parameters:
  learning_rate:
    values: [0.0001, 0.0003, 0.0005, 0.001]
  buffer_size:
    values: [50000, 100000, 200000]
  batch_size:
    values: [64, 128, 256]
  tau:
    values: [0.001, 0.005, 0.01]
  gamma:
    values: [0.95, 0.98, 0.99, 0.995]
  target_update_interval:
    values: [1, 100, 500, 1000, 2000]
