program: training/sweep_timesnet.py
method: bayes
metric:
  name: val_mse
  goal: minimize
parameters:
  seq_len:
    values: [5, 10, 15, 20]
  d_model:
    values: [16, 32, 64]
  d_ff:
    values: [32, 64, 128]
  e_layers:
    values: [1, 2, 3]
  top_k:
    values: [1, 2, 3, 5]
  learning_rate:
    values: [0.0001, 0.0005, 0.001, 0.005]
